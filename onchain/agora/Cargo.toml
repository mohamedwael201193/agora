[package]
name = "agora"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
linera-sdk = "0.15.6"
linera-base = "0.15.6"
serde = { version = "1", features = ["derive"] }
async-graphql = "7"
async-trait = "0.1"
blake3 = "1"
hex = "0.4"
futures = "0.3"

[[bin]]
name = "agora_contract"
path = "src/contract.rs"

[[bin]]
name = "agora_service"
path = "src/service.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 'z'
strip = 'debuginfo'
